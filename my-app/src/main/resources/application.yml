spring:
  application:
    name: my-app
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/tatkal_final?serverTimezone=UTC}
    username: ${JDBC_DATABASE_USERNAME:root}
    password: ${JDBC_DATABASE_PASSWORD:root}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  docker:
    compose:
#      lifecycle-management: start-only
      enabled: false
server:
  port: 8085
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      StationCodeValid: STATION_CODE_VALID
      TrainNumberValid: TRAIN_NUMBER_VALID
      TravelClassCodeValid: TRAVEL_CLASS_CODE_VALID
      QuotaCodeValid: QUOTA_CODE_VALID
      TrainStopSeqValid: TRAIN_STOP_SEQ_VALID
      CoachIdValid: COACH_ID_VALID
      BerthIdValid: BERTH_ID_VALID
      TrainClassQuotaSeatsValid: TRAIN_CLASS_QUOTA_SEATS_VALID
      TripIdValid: TRIP_ID_VALID
      SegmentAvailabilityClassCodeValid: SEGMENT_AVAILABILITY_CLASS_CODE_VALID
      BookingIdValid: BOOKING_ID_VALID
      BookingPnrUnique: BOOKING_PNR_UNIQUE
      PassengerIdValid: PASSENGER_ID_VALID
      BerthAllocationIdValid: BERTH_ALLOCATION_ID_VALID
      BerthOccupancyTripIdValid: BERTH_OCCUPANCY_TRIP_ID_VALID
      PaymentIdValid: PAYMENT_ID_VALID
      PaymentGatewayRefUnique: PAYMENT_GATEWAY_REF_UNIQUE
      BookingEventIdValid: BOOKING_EVENT_ID_VALID
